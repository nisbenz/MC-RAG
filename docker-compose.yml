services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    expose:
      - "6333"
    # Uncomment to reach Qdrant from the host during local dev
    # ports:
    #   - "6333:6333"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data

  # The Discord bot: same image, no port, no volume, and no model of its own.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    command: ["python", "-m", "mcclub_rag.discordbot"]
    # The image's healthcheck curls :8000, which the bot does not serve
    healthcheck:
      disable: true

volumes:
  qdrant_storage:
  app_data:
